name: Build & CI Tests

on:
  push:
    branches: ["main", "dev"]
    tags:
      - "v*.*.*"
  pull_request:
    branches: ["main", "dev"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  actions: write
  contents: read
  packages: write

jobs:
  build-and-push-container:
    name: Build Docker Image & Run CI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up build environment
        id: setup_build_env
        uses: ./.github/actions/setup-image-build-env
        with:
          quay-username: ${{ secrets.QUAY_IO_USERNAME }}
          quay-password: ${{ secrets.QUAY_IO_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/pixelgentechnologies/pixelatores
            890888997283.dkr.ecr.eu-north-1.amazonaws.com/experiment-summary
            quay.io/pixelgen-technologies/pixelatores
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # Build base image
      - name: Build base Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          target: build
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Extract single sha tag for local use
      - name: Select SHA tag
        id: picksha
        run: |
          # get the first tag containing "sha" from metadata
          echo "sha_image=$(echo '${{ steps.meta.outputs.tags }}' | tr ' ' '\n' | grep 'sha-' | head -n1)" >> $GITHUB_OUTPUT

      # Test the base image
      - name: Smoke-test base image
        run: |
          docker run --rm ${{ steps.picksha.outputs.sha_image }} echo "Base image OK"

      # Push base image
      - name: Push base Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          target: build
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build test image locally only
      - name: Build test image (local only)
        run: |
          TAG="${{ steps.picksha.outputs.sha_image }}"
          TAG="${TAG##*:}"
          docker build \
            --target test \
            -t experiment-summary-test:$TAG .

      # Run CI tests inside local test image
      - name: Run R CMD check & Quarto smoke test
        run: |
          TAG="${{ steps.picksha.outputs.sha_image }}"
          TAG="${TAG##*:}"
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            experiment-summary-test:$TAG \
            /bin/bash -c "\
              export QUARTO_PROFILE=ci; \
              quarto render inst/quarto/pixelatorES.qmd \
                --output testrun.html"
